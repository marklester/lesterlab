apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pig-ebank
  namespace: argocd
spec:
  destination:
    namespace: pig-ebank
    server: https://kubernetes.default.svc
  project: default
  source:
    path: kubernetes/argocd/main-cluster/manifests/pig-ebank
    repoURL: https://github.com/marklester/lesterlab.git
    targetRevision: HEAD
  # The registry poller owns only this rollout marker; the image stays in Git.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: pig-ebank
      namespace: pig-ebank
      jsonPointers:
        - /spec/template/metadata/annotations/pig-ebank.home~1image-digest
  syncPolicy:
    automated:
      prune: true       # Automatically delete resources no longer in Git
      selfHeal: true    # Correct manual changes made in the cluster (drift detection)
    syncOptions:
      - CreateNamespace=true           # Automatically create the target namespace if it doesn't exist
      - PruneLast=true                 # Defer resource deletion until after new ones are applied (safer rollouts)
      - PrunePropagationPolicy=foreground # Gracefully delete dependent resources (recommended for safety)
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
