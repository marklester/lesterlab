# This is used to collector and push metrics to moonbase
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: opentelemetry-collector
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    targetRevision: 0.173.1
    helm:
      valuesObject:         
        namespaceOverride: monitoring
        mode: daemonset
        presets:
          kubeletMetrics:
            enabled: true
        serviceAccount:
          create: false
          name: otel-collector-sa
        clusterRole:
          rules:
            - apiGroups: [""]
              resources: ["nodes/metrics"]
              verbs: ["get"]
        image:
          repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib"
        config:
          receivers:
            prometheus:                 
              api_server:
                enabled: true
                server_config:
                  endpoint: "localhost:9090"
              config:
                scrape_configs: 
                  - job_name: 'node-exporter'
                    scrape_interval: 30s
                    kubernetes_sd_configs:
                      - role: pod
                    relabel_configs:
                      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                        action: keep
                        regex: true
                  # VolSync controller metrics (volsync_missed_intervals_total,
                  # volsync_sync_duration_seconds, volsync_volume_out_of_sync).
                  # Served over HTTPS with a self-signed cert; auth is disabled
                  # in the VolSync chart (metrics.disableAuth) so no bearer
                  # token is needed.
                  - job_name: 'volsync'
                    scrape_interval: 30s
                    scheme: https
                    tls_config:
                      insecure_skip_verify: true
                    kubernetes_sd_configs:
                      - role: pod
                    relabel_configs:
                      - source_labels: [__meta_kubernetes_pod_label_control_plane]
                        action: keep
                        regex: volsync-controller
                  # Each DaemonSet pod scrapes its own kubelet. Native kubelet
                  # volume stats retain the PVC namespace/name labels.
                  - job_name: 'kubelet-pvc-stats'
                    scrape_interval: 30s
                    scheme: https
                    metrics_path: /metrics
                    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                    tls_config:
                      insecure_skip_verify: true
                    static_configs:
                      - targets:
                          - '${env:K8S_NODE_IP}:10250'
                    metric_relabel_configs:
                      - source_labels: [__name__]
                        regex: 'kubelet_volume_stats_(used|capacity|available)_bytes'
                        action: keep
          exporters:
            prometheusremotewrite:
              endpoint: "http://prometheus.moonbase.home/api/v1/write"
              resource_to_telemetry_conversion:
                enabled: true
          processors:
            batch: {}
            resource:
              attributes:
              - key: cluster
                value: "main"
                action: insert # Add if not present
              - key: collector.instance.id
                value: "otel-collector"
                action: insert
          service:
            pipelines:
              metrics:
                receivers: [prometheus]
                processors: [resource,batch]
                exporters: [debug,prometheusremotewrite]
  syncPolicy:
    automated:
      prune: true       # Automatically delete resources no longer in Git
      selfHeal: true    # Correct manual changes made in the cluster (drift detection)
    syncOptions:
      - CreateNamespace=true           # Automatically create the target namespace if it doesn't exist
      - PruneLast=true                 # Defer resource deletion until after new ones are applied (safer rollouts)
      - PrunePropagationPolicy=foreground # Gracefully delete dependent resources (recommended for safety)
      - ServerSideApply=true
