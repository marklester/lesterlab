# SUC mounts scripts from Secrets. These scripts contain no credentials.
apiVersion: v1
kind: Secret
metadata:
  name: os-maintenance-scripts
  namespace: system-upgrade-controller
type: Opaque
stringData:
  maintenance.py: |
    import json
    import os
    import ssl
    import sys
    import time
    import urllib.request
    from datetime import datetime, timezone
    from pathlib import Path

    NAMESPACE = "system-upgrade-controller"
    PLAN = os.environ.get("OS_PLAN", "ubuntu-os")
    TOKEN_DIR = Path("/var/run/secrets/kubernetes.io/serviceaccount")
    AUTH_WARNINGS = {
        "AUTH_INSECURE_CLIENT_KEY_TYPE", "AUTH_INSECURE_KEYS_ALLOWED",
        "AUTH_INSECURE_KEYS_CREATABLE",
    }

    def api(path, method="GET", body=None):
        token = (TOKEN_DIR / "token").read_text().strip()
        context = ssl.create_default_context(cafile=str(TOKEN_DIR / "ca.crt"))
        request = urllib.request.Request(
            "https://kubernetes.default.svc" + path,
            data=json.dumps(body).encode() if body is not None else None,
            method=method,
            headers={"Authorization": "Bearer " + token,
                     "Content-Type": "application/merge-patch+json"},
        )
        with urllib.request.urlopen(request, context=context, timeout=30) as response:
            return json.load(response)

    def plan_path(name=PLAN):
        return f"/apis/upgrade.cattle.io/v1/namespaces/{NAMESPACE}/plans/{name}"

    def health_problems(nodes, ceph=None, own_node=""):
        problems = []
        for node in nodes:
            name = node["metadata"]["name"]
            conditions = {c["type"]: c["status"] for c in node["status"]["conditions"]}
            if conditions.get("Ready") != "True":
                problems.append(f"{name} is not Ready")
            for condition in ("MemoryPressure", "DiskPressure", "PIDPressure"):
                if conditions.get(condition) != "False":
                    problems.append(f"{name} has unknown or active {condition}")
            if node.get("spec", {}).get("unschedulable") and name != own_node:
                problems.append(f"{name} is cordoned")
        if ceph is not None:
            status = ceph.get("status", {})
            health = status.get("ceph", {})
            details = health.get("details", {})
            # Existing auth-key warnings are unrelated to storage recovery.
            # Slow operations, degraded PGs, OSD failures, and unknown warnings
            # block maintenance until storage has recovered.
            if (status.get("phase") != "Ready"
                    or health.get("health") not in ("HEALTH_OK", "HEALTH_WARN")
                    or (health.get("health") == "HEALTH_WARN" and not details)
                    or set(details) - AUTH_WARNINGS):
                problems.append("Ceph is not ready for maintenance: " + json.dumps(health))
            # A stale status must not authorize the next node reboot.
            checked = health.get("lastChecked")
            if not checked or time.time() - datetime.fromisoformat(
                    checked.replace("Z", "+00:00")).timestamp() > 180:
                problems.append("Ceph health status is missing or older than 3 minutes")
        return problems

    def trigger():
        plan = api(plan_path())
        if plan.get("status", {}).get("applying"):
            raise RuntimeError("Previous OS cycle is still applying; refusing to reset it")
        jobs = api(f"/apis/batch/v1/namespaces/{NAMESPACE}/jobs")["items"]
        for job in jobs:
            if (job["metadata"].get("labels", {}).get("upgrade.cattle.io/plan") == PLAN
                    and job.get("status", {}).get("active", 0)):
                raise RuntimeError("Previous OS job is still active; refusing to reset it")
        # Each scheduled Job retries the same identifier; changing it once per
        # week makes SUC rerun on nodes whose previous cycle is complete.
        run = datetime.now(timezone.utc).strftime("os-%Y-%m-%d")
        api(plan_path(), "PATCH", {"spec": {"version": run}})
        print(f"Armed {PLAN} cycle {run}", flush=True)

    def prepare():
        own_node = os.environ["SYSTEM_UPGRADE_NODE_NAME"]
        run = os.environ["SYSTEM_UPGRADE_PLAN_LATEST_VERSION"]
        # After reboot the replacement Pod must complete before SUC can
        # uncordon this node. Storage recovery is checked before the NEXT node.
        state = Path("/host/var/lib/lesterlab-os-maintenance/reboot-pending")
        if state.exists():
            previous = state.read_text().splitlines()
            boot = Path("/host/proc/sys/kernel/random/boot_id").read_text().strip()
            if len(previous) == 2 and previous[0] == run and previous[1] != boot:
                print("Node rebooted; allowing the upgrade container to finish", flush=True)
                return
        stable_since = None
        deadline = time.monotonic() + 1800
        while time.monotonic() < deadline:
            try:
                nodes = api("/api/v1/nodes")["items"]
                ceph = None
                if os.environ.get("CHECK_CEPH", "true") == "true":
                    ceph = api("/apis/ceph.rook.io/v1/namespaces/rook-ceph/cephclusters/rook-ceph")
                problems = health_problems(nodes, ceph, own_node)
                plans = api(f"/apis/upgrade.cattle.io/v1/namespaces/{NAMESPACE}/plans")["items"]
                for plan in plans:
                    if plan["metadata"]["name"] == PLAN:
                        continue
                    status = plan.get("status", {})
                    label = "plan.upgrade.cattle.io/" + plan["metadata"]["name"]
                    if status.get("applying") or any(
                            n["metadata"].get("labels", {}).get(label)
                            not in (status.get("latestHash"), "disabled") for n in nodes):
                        problems.append("Another upgrade Plan is pending or applying")
                if problems:
                    stable_since = None
                    print("Waiting: " + "; ".join(problems), flush=True)
                else:
                    stable_since = stable_since or time.monotonic()
                    if time.monotonic() - stable_since >= 120:
                        print("Cluster health stable for 2 minutes; allowing drain", flush=True)
                        return
            except Exception as error:
                stable_since = None
                print(f"Health check unavailable: {error}", flush=True)
            time.sleep(30)
        raise RuntimeError("Cluster health did not recover within 30 minutes")

    if __name__ == "__main__":
        {"trigger": trigger, "prepare": prepare}[sys.argv[1]]()
  upgrade.sh: |
    set -euo pipefail
    maintenance_run="$1"
    maintenance_state=/var/lib/lesterlab-os-maintenance
    mkdir -p "$maintenance_state"
    maintenance_boot=$(cat /proc/sys/kernel/random/boot_id)
    . /etc/os-release
    case "$ID:$VERSION_ID" in
      ubuntu:24.04|debian:13) ;;
      *) echo "Unsupported OS: $ID $VERSION_ID" >&2; exit 1 ;;
    esac

    # A reboot kills the first container. Its replacement observes a new boot
    # ID and finishes the SAME cycle instead of updating/rebooting in a loop.
    if [[ -f "$maintenance_state/reboot-pending" ]]; then
      mapfile -t maintenance_previous < "$maintenance_state/reboot-pending"
      if [[ "${maintenance_previous[0]:-}" == "$maintenance_run" ]]; then
        if [[ "${maintenance_previous[1]:-}" != "$maintenance_boot" ]]; then
          printf '%s\n' "$maintenance_run" > "$maintenance_state/completed"
          rm "$maintenance_state/reboot-pending"
          echo "Reboot completed for $maintenance_run"
          exit 0
        fi
        echo "Still waiting for the requested reboot" >&2
        exit 1
      fi
      echo "An earlier cycle still has an unconfirmed reboot" >&2
      exit 1
    fi
    if [[ -f "$maintenance_state/completed" ]] && \
       [[ "$(cat "$maintenance_state/completed")" == "$maintenance_run" ]]; then
      echo "Cycle $maintenance_run already completed"
      exit 0
    fi

    # Check Moonbase's actual ZFS pools, not merely Kubernetes node readiness.
    if command -v zpool >/dev/null; then
      maintenance_zfs=$(zpool status -x)
      [[ "$maintenance_zfs" == "all pools are healthy" ]] || {
        echo "$maintenance_zfs" >&2; exit 1;
      }
    fi
    export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l LC_ALL=C
    maintenance_apt_options=(-o DPkg::Lock::Timeout=900 -o APT::Update::Error-Mode=any \
      -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold)
    apt-get "${maintenance_apt_options[@]}" update
    maintenance_action=(upgrade --with-new-pkgs)
    # Proxmox recommends dist-upgrade. Refuse package removals so a transition
    # requiring removal needs review rather than removing pve/zfs packages.
    if command -v pveversion >/dev/null; then
      maintenance_action=(dist-upgrade)
    fi
    maintenance_proposal=$(apt-get "${maintenance_apt_options[@]}" --no-remove -s "${maintenance_action[@]}")
    if ! grep -q '^Inst ' <<< "$maintenance_proposal" && [[ ! -f /run/reboot-required ]]; then
      printf '%s\n' "$maintenance_run" > "$maintenance_state/completed"
      echo "No package updates or reboot needed"
      exit 0
    fi
    apt-get "${maintenance_apt_options[@]}" --no-remove -y "${maintenance_action[@]}"
    # Reboot after any installed updates, including Debian service updates
    # that do not create Ubuntu's /run/reboot-required file.
    printf '%s\n%s\n' "$maintenance_run" "$maintenance_boot" > "$maintenance_state/reboot-pending"
    sync
    systemd-run --unit=lesterlab-os-maintenance-reboot --on-active=10s /usr/bin/systemctl reboot
    echo "Updates installed; waiting for reboot"
    # Keep the Job active until the reboot kills this container. Returning 0
    # here would release SUC's concurrency slot before the node came back.
    sleep 300
    echo "Reboot did not occur within 5 minutes" >&2
    exit 1
