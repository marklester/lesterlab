apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-cephfs-retain
# Change "rook-ceph" provisioner prefix to match the operator namespace if needed
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  # clusterID is the namespace where operator is deployed.
  clusterID: rook-ceph

  # CephFS filesystem name into which the volume shall be created
  fsName: cephfs

  # Ceph pool into which the volume shall be created
  # Required for provisionVolume: "true"
  pool: cephfs-data0

  # The secrets contain Ceph admin credentials. These are generated automatically by the operator
  # in the same namespace as the cluster.
  #
  # These csi.storage.k8s.io/*-secret-* parameters are REQUIRED: ceph-csi does not
  # auto-discover the operator-created secrets, and provisioning fails with
  # "provided secret is empty" if they are absent (see
  # https://github.com/ceph/ceph-csi/blob/devel/internal/util/credentials.go).
  # Matches the upstream Rook example:
  # https://github.com/rook/rook/blob/master/deploy/examples/csi/cephfs/storageclass.yaml
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph # namespace:cluster
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph # namespace:cluster
  csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph # namespace:cluster
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph # namespace:cluster
reclaimPolicy: Retain
allowVolumeExpansion: true