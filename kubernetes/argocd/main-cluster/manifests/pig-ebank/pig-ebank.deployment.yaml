apiVersion: apps/v1
kind: Deployment
metadata:
  name: pig-ebank
  namespace: pig-ebank
  labels:
    app: pig-ebank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pig-ebank
  template:
    metadata:
      labels:
        app: pig-ebank
    spec:
      imagePullSecrets:
        - name: pig-ebank-ghcr-credentials
      containers:
      - name: pig-ebank
        image: ghcr.io/marklester/pig-ebank:main
        imagePullPolicy: Always
        env:
          # TLS terminates at Traefik/NGINX. Spring must see the public HTTPS
          # scheme when issuing its remember-me cookie and redirect URLs.
          - name: SERVER_FORWARDHEADERSSTRATEGY
            value: framework
          - name: SERVER_SERVLET_SESSION_COOKIE_SECURE
            value: "true"
          - name: SERVER_SERVLET_SESSION_COOKIE_HTTPONLY
            value: "true"
          - name: SERVER_SERVLET_SESSION_COOKIE_SAMESITE
            value: lax
          - name: FAMILY_INVITATION_BASE_URL
            value: "https://pig-ebank.app"
          - name: SPRING_DATASOURCE_URL
            value: "jdbc:h2:file:/data/appdb"
          - name: STORAGE_ROOTPATH
            value: "/data"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        volumeMounts:
          - name: pig-ebank-storage
            mountPath: /data
      volumes:
        - name: pig-ebank-storage
          persistentVolumeClaim:
            claimName: pig-ebank-storage
