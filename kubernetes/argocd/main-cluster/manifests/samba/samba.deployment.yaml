apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: samba
  labels:
    app.kubernetes.io/name: samba
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: samba
  template:
    metadata:
      labels:
        app.kubernetes.io/name: samba
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: samba
          image: quay.io/samba.org/samba-server:v0.9
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --setup=config
            - --setup=users
            - --setup=users_passdb
            - --setup=nsswitch
            - smbd
          env:
            - name: SAMBACC_CONFIG
              value: /etc/samba-container/config.json:/etc/samba-credentials/users.json
            - name: SAMBA_CONTAINER_ID
              value: samba
          ports:
            - name: smb
              containerPort: 445
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: smb
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: smb
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/samba-container
              readOnly: true
            - name: credentials
              mountPath: /etc/samba-credentials
              readOnly: true
            - name: state
              mountPath: /var/lib/samba
            - name: run
              mountPath: /run/samba
            - name: cephfs
              mountPath: /shares/backups
              subPath: backups
            - name: cephfs
              mountPath: /shares/home
              subPath: home
            - name: cephfs
              mountPath: /shares/media
              subPath: media
      volumes:
        - name: config
          configMap:
            name: samba-config
        - name: credentials
          secret:
            secretName: samba-credentials
        - name: state
          persistentVolumeClaim:
            claimName: samba-state
        - name: run
          emptyDir:
            medium: Memory
        - name: cephfs
          persistentVolumeClaim:
            claimName: samba-cephfs
