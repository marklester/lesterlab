apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: lidarr
  labels:
    app: lidarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      name: lidarr
      labels:
        app: lidarr
    spec:
      initContainers:
      - name: seed-config
        image: ghcr.io/hotio/lidarr:pr-plugins-3.1.2.4913
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          set -e
          if [ -f /config/config.xml ]; then
            echo "config.xml already present, leaving as-is"
          else
            cp /cm/config.xml /config/config.xml
            chown 65534:65534 /config/config.xml
            chmod 644 /config/config.xml
            echo "seeded /config/config.xml from ConfigMap"
          fi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: config-xml
          mountPath: /cm
          readOnly: true
      containers:
      - name: lidarr
        image: ghcr.io/hotio/lidarr:pr-plugins-3.1.2.4913
        imagePullPolicy: Always
        env:
        - name: PUID
          value: "65534"
        - name: PGID
          value: "65534"
        volumeMounts:
        - name: downloads
          mountPath: /downloads
        - name: config
          mountPath: /config
        - name: music
          mountPath: /music
        ports:
        - name: web
          containerPort: 8686
          protocol: TCP
      volumes: 
      - name: downloads
        nfs:
          server: ceph-nfs.home
          path: /cephfs/media/downloads
      - name: config
        persistentVolumeClaim:
          claimName: lidarr-config
      - name: music
        nfs:
          server: ceph-nfs.home
          path: /cephfs/media/Music
