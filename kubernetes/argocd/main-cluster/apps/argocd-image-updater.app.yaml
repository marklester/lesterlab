apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: 1.3.2
      helm:
        valuesObject:
          fullnameOverride: argocd-image-updater
          createClusterRoles: false
          config:
            argocd.namespace: argocd
            watch.namespaces: argocd
            interval: 5m
            git.user: Argo CD Image Updater
            git.email: argocd-image-updater@lesterlab.local
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
    - repoURL: https://github.com/marklester/lesterlab.git
      targetRevision: master
      path: kubernetes/argocd/main-cluster/manifests/argocd-image-updater
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
