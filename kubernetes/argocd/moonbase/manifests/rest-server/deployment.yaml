apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
  namespace: rest-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rest-server
  template:
    metadata:
      labels:
        app: rest-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rest-server
          image: restic/rest-server:0.14.0
          command:
            - /bin/sh
            - -ec
          args:
            - |
              # Refuse to write to the OS disk if the ZFS mount is missing.
              awk '$2 == "/data" && $3 == "zfs" { found=1 } END { exit !found }' /proc/mounts || {
                echo "Repository /data must be backed by mounted ZFS" >&2
                exit 1
              }
              exec /usr/bin/rest-server \
                --path /data \
                --listen :8000 \
                --no-auth
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: repositories
              mountPath: /data
      volumes:
        - name: repositories
          persistentVolumeClaim:
            claimName: rest-server-repositories
