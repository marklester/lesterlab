apiVersion: batch/v1
kind: CronJob
metadata:
  name: pig-ebank-image-update
  namespace: pig-ebank
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      template:
        spec:
          serviceAccountName: pig-ebank-image-update
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check-image
              image: python:3.13.13-alpine3.22
              command: [python, -B, /scripts/check-image.py]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: registry-credentials
                  mountPath: /registry
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: pig-ebank-image-update
            - name: registry-credentials
              secret:
                secretName: pig-ebank-ghcr-credentials
