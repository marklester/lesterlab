apiVersion: v1
kind: Service
metadata:
  name: samba
  namespace: samba
  annotations:
    metallb.io/loadBalancerIPs: 192.168.0.217
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.0.217
  selector:
    app.kubernetes.io/name: samba
  ports:
    - name: smb
      port: 445
      targetPort: smb
      protocol: TCP
