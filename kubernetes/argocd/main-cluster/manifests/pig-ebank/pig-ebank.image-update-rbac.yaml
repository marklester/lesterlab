apiVersion: v1
kind: ServiceAccount
metadata:
  name: pig-ebank-image-update
  namespace: pig-ebank
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pig-ebank-image-update
  namespace: pig-ebank
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [pig-ebank]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pig-ebank-image-update
  namespace: pig-ebank
subjects:
  - kind: ServiceAccount
    name: pig-ebank-image-update
    namespace: pig-ebank
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pig-ebank-image-update
