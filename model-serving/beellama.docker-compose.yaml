services:
  llama:
    image: ghcr.io/anbeeld/beellama.cpp:server-cuda13
    container_name: beellama-server
    environment:
      - LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"preserve-thinking":true,"reasoning_effort":"medium"}
    ports:
      - "1234:8080"
    volumes:
      - C:\Users\starf\.lmstudio\models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      -m /models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ3_S.gguf
      --no-mmproj
      --device CUDA0
      --spec-draft-device CUDA0
      --gpu-layers-draft all
      --spec-type draft-mtp
      --spec-draft-n-max 3
      --n-gpu-layers all
      --threads 6
      --fit off
      --load-mode none
      --no-warmup
      --flash-attn on
      --ctx-size 94208
      --parallel 1
      --cache-type-k q4_0
      --cache-type-v q4_0
      --batch-size 512
      --ubatch-size 512
      --jinja
      --temp 1
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning auto
      --reasoning-preserve
      --host 0.0.0.0
      --port 8080
    restart: unless-stopped
