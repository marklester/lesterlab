apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mqtt
data:
  mosquitto.conf: |-
    listener 1883
    allow_anonymous true
    socket_domain ipv4
    # listener 9001
    persistence true
    persistence_location /mosquitto/data/
    
    log_timestamp true
    log_timestamp_format %Y-%m-%dT%H:%M:%S
    # log_dest file /mosquitto/log/mosquitto.log
