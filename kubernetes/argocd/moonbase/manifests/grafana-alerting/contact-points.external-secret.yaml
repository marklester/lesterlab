apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-alerting-contact-points
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: moonbase-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-alerting-contact-points
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          grafana_alert: "1"
      data:
        contact-points.yaml: |
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: email
              receivers:
                - uid: lesterlab-email
                  type: email
                  settings:
                    addresses: "{{ .email }}"
  data:
    - secretKey: email
      remoteRef:
        key: grafana/smtp/username
        version: v1
        decodingStrategy: Base64
