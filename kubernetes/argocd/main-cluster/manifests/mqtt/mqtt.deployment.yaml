apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt
  namespace: mqtt
  labels:
    app: mqtt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt
  template:
    metadata:
      labels:
        app: mqtt
    spec:
      containers:
      - name: mqtt
        image: eclipse-mosquitto:latest
        imagePullPolicy: Always
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
        ports:
        - name: mqtt
          containerPort: 1883
          protocol: TCP
        - name: port2
          containerPort: 9001
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /mosquitto/data
        - name: mqtt-conf
          mountPath: /mosquitto/config
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mqtt-config
      - name: mqtt-conf
        configMap:
          name: mosquitto-config
          items:
            - key: mosquitto.conf
              path: mosquitto.conf
