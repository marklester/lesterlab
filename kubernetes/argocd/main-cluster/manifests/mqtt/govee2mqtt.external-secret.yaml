apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: govee-credentials
  namespace: mqtt
spec:
  secretStoreRef:
    name: main-secret-store
    kind: ClusterSecretStore
  target:
    name: govee-credentials
    creationPolicy: Owner
  data:
    - secretKey: email
      remoteRef:
        key: email
        version: v1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: govee/password
        version: v1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: api-key
      remoteRef:
        key: govee/api-key
        version: v1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
