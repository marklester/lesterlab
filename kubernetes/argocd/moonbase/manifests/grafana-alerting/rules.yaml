apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: lesterlab-infrastructure
        folder: Infrastructure
        interval: 1m
        rules:
          # --- Ceph OSD down: any OSD reports down (ceph_osd_up == 0) ---
          - uid: ceph-osd-down
            title: Ceph OSD down
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: min(ceph_osd_up)
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.5
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "A Ceph OSD is down"
            isPaused: false

          # --- Ceph low space: cluster free space below 10% ---
          - uid: ceph-low-space
            title: Ceph cluster low space
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: min((ceph_cluster_total_bytes - ceph_cluster_total_used_bytes) / ceph_cluster_total_bytes)
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.10
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Ceph cluster free space below 10%"
            isPaused: false

          # --- Disk unhealthy on either cluster: SMART failure or any NVMe critical warning ---
          - uid: disk-unhealthy
            title: Disk unhealthy (SMART)
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: count(smartctl_device_smart_status == 0 or smartctl_device_critical_warning > 0) or (0 * count(smartctl_device_smart_status))
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "A disk reports unhealthy (SMART)"
            isPaused: false

          # --- Main-cluster CephFS PVC over 85% full ---
          - uid: pvc-low-space
            title: PVC low space (main)
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: max by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{cluster="main"} / kubelet_volume_stats_capacity_bytes{cluster="main"})
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.85
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Main-cluster PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over 85% full"
            isPaused: false

          # --- Moonbase local-path PVCs share this ZFS backing filesystem ---
          - uid: moonbase-pvc-storage-low
            title: Moonbase PVC backing storage low space
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: max(1 - node_filesystem_avail_bytes{mountpoint="/tank/local-path-provisioner",fstype="zfs"} / node_filesystem_size_bytes{mountpoint="/tank/local-path-provisioner",fstype="zfs"})
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.85
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Moonbase local-path PVC backing storage is over 85% full"
            isPaused: false

      # VolSync backup monitoring. Metrics are scraped on main by the OTel
      # collector (job "volsync") and remote-written here with cluster="main".
      # Expected policies: jackett-config, plex-config, sonarr-config,
      # radarr-config, lidarr-config (see main-cluster/manifests/*/
      # *.volsync-restic.replicationsource.yaml).
      - orgId: 1
        name: volsync-backups
        folder: Backups
        interval: 1m
        rules:
          # --- VolSync controller metrics missing: source outage. The
          # controller pod is down, the scrape job is broken, or remote-write
          # is down. Fires even though every other backup alert goes quiet. ---
          - uid: volsync-metrics-missing
            title: VolSync metrics missing (main)
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: count(volsync_volume_out_of_sync{cluster="main"})
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "No VolSync metrics from main for 5m - controller, scrape, or remote-write outage"
            isPaused: false

          # --- Expected policy missing: a ReplicationSource that should be
          # reporting is absent from the metrics (deleted, or its namespace
          # gone). ---
          - uid: volsync-policy-missing
            title: Expected VolSync policy missing
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: count(volsync_volume_out_of_sync{cluster="main",obj_name=~"jackett-config|plex-config|sonarr-config|radarr-config|lidarr-config"})
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 5
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Fewer than 5 expected VolSync policies are reporting (jackett/plex/sonarr/radarr/lidarr-config)"
            isPaused: false

          # --- Backup age: no completed sync for a policy in 12h (policies
          # run every 6h, so this allows one full missed cycle). ---
          - uid: volsync-backup-stale
            title: VolSync backup stale (no sync in 12h)
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: increase(volsync_sync_duration_seconds_count{cluster="main"}[12h]) == 0
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "VolSync policy {{ $labels.obj_name }} has had no completed sync in 12h"
            isPaused: false

          # --- Missed intervals: VolSync skipped a scheduled sync (job
          # failure, stall, or the previous run still running). ---
          - uid: volsync-missed-intervals
            title: VolSync missed scheduled sync
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: increase(volsync_missed_intervals_total{cluster="main"}[10m]) > 0
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "VolSync policy {{ $labels.obj_name }} missed a scheduled sync interval"
            isPaused: false

          # --- Volume out of sync: the last sync did not complete within the
          # policy's allowed window. ---
          - uid: volsync-volume-out-of-sync
            title: VolSync volume out of sync
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: max by (obj_name, obj_namespace) (volsync_volume_out_of_sync{cluster="main"} == 1)
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "VolSync policy {{ $labels.obj_name }} ({{ $labels.obj_namespace }}) is out of sync"
            isPaused: false

          # --- Destination: the ZFS-backed repository mount is gone. A
          # missing mountpoint makes node_filesystem_* disappear, which also
          # indicates the ZFS pool/dataset is no longer mounted. ---
          - uid: moonbase-zfs-mount-missing
            title: Moonbase ZFS repository mount missing
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: count(node_filesystem_avail_bytes{mountpoint="/tank/local-path-provisioner",fstype="zfs"})
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Moonbase /tank/local-path-provisioner ZFS mount is not visible to node-exporter"
            isPaused: false

          # --- Destination: the rest-server pod is not running, so backups
          # cannot reach the repository even if VolSync is healthy. ---
          - uid: rest-server-pod-down
            title: Restic REST server pod not running
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: max(kube_pod_status_ready{namespace="rest-server",pod=~"rest-server-.*"})
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.99
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "The rest-server pod on Moonbase is not ready"
            isPaused: false
