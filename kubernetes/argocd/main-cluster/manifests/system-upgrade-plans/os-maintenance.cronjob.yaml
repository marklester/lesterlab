apiVersion: batch/v1
kind: CronJob
metadata:
  name: os-maintenance
  namespace: system-upgrade-controller
spec:
  # Arm the cycle before the Plan window opens, avoiding overlapping hashes
  # when the first run and scheduler would otherwise both start at 03:00.
  schedule: "45 2 * * 0"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: os-maintenance
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: schedule
              image: python:3.13.13-alpine3.22
              command: [python3]
              args: [/scripts/maintenance.py, trigger]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              secret:
                secretName: os-maintenance-scripts
