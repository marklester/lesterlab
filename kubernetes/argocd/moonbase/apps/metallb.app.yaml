# MetalLB (Helm chart). Deploys the controller + speaker + CRDs into
# metallb-system. The address pool / L2 advertisement config lives in the
# companion `metallb-config` app (manifests/metallb-config).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-moonbase
  namespace: argocd
spec:
  destination:
    namespace: metallb-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: metallb
    repoURL: https://metallb.github.io/metallb
    targetRevision: 0.16.1
    helm:
      valuesObject:
        speaker:
          frr:
            enabled: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
