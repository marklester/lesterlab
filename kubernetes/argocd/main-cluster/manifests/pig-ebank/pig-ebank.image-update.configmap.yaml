apiVersion: v1
kind: ConfigMap
metadata:
  name: pig-ebank-image-update
  namespace: pig-ebank
data:
  check-image.py: |
    import base64
    import json
    import re
    import ssl
    import urllib.request
    from pathlib import Path

    IMAGE = "ghcr.io/marklester/pig-ebank:main"
    ANNOTATION = "pig-ebank.home/image-digest"
    SERVICE_ACCOUNT = Path("/var/run/secrets/kubernetes.io/serviceaccount")
    DEPLOYMENT_URL = (
        "https://kubernetes.default.svc/apis/apps/v1/namespaces/pig-ebank/"
        "deployments/pig-ebank"
    )

    def resolve_digest():
        config = json.loads(Path("/registry/.dockerconfigjson").read_text())
        auths = config["auths"]
        credentials = auths.get("https://ghcr.io") or auths["ghcr.io"]
        auth = credentials.get("auth")
        if not auth:
            auth = base64.b64encode(
                (credentials["username"] + ":" + credentials["password"]).encode()
            ).decode()
        request = urllib.request.Request(
            "https://ghcr.io/token?service=ghcr.io&"
            "scope=repository:marklester/pig-ebank:pull",
            headers={"Authorization": "Basic " + auth},
        )
        with urllib.request.urlopen(request, timeout=30) as response:
            token = json.load(response)["token"]
        request = urllib.request.Request(
            "https://ghcr.io/v2/marklester/pig-ebank/manifests/main",
            method="HEAD",
            headers={
                "Authorization": "Bearer " + token,
                "Accept": ", ".join([
                    "application/vnd.oci.image.index.v1+json",
                    "application/vnd.oci.image.manifest.v1+json",
                    "application/vnd.docker.distribution.manifest.list.v2+json",
                    "application/vnd.docker.distribution.manifest.v2+json",
                ]),
            },
        )
        with urllib.request.urlopen(request, timeout=30) as response:
            digest = response.headers.get("Docker-Content-Digest", "")
        if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
            raise RuntimeError("GHCR returned no valid image digest; leaving Deployment unchanged")
        return digest

    def deployment_request(body=None):
        context = ssl.create_default_context(cafile=str(SERVICE_ACCOUNT / "ca.crt"))
        request = urllib.request.Request(
            DEPLOYMENT_URL,
            data=json.dumps(body).encode() if body is not None else None,
            method="PATCH" if body is not None else "GET",
            headers={
                "Authorization": "Bearer " + (SERVICE_ACCOUNT / "token").read_text().strip(),
                "Content-Type": "application/merge-patch+json",
            },
        )
        with urllib.request.urlopen(request, context=context, timeout=30) as response:
            return json.load(response)

    def main():
        deployment = deployment_request()
        template = deployment["spec"]["template"]
        containers = template["spec"]["containers"]
        image = next(c["image"] for c in containers if c["name"] == "pig-ebank")
        if image != IMAGE or deployment["spec"].get("paused", False):
            print("Deployment is paused or no longer follows main; skipping")
            return
        digest = resolve_digest()
        annotations = template["metadata"].get("annotations") or {}
        if annotations.get(ANNOTATION) == digest:
            print("main is unchanged: " + digest)
            return
        # Optimistic concurrency prevents a concurrent Git sync/operator change
        # from being overwritten. Only this annotation changes the Pod template.
        deployment_request({
            "metadata": {"resourceVersion": deployment["metadata"]["resourceVersion"]},
            "spec": {"template": {"metadata": {"annotations": {ANNOTATION: digest}}}},
        })
        print("Requested rollout for main: " + digest)

    if __name__ == "__main__":
        main()
