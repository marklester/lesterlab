# The metallb-system namespace. The privileged pod-security labels are
# required for the speaker pods (NET_ADMIN/NET_RAW) when Pod Security
# Admission enforcement is active.
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
