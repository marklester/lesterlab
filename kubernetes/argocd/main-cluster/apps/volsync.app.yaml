apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volsync
  namespace: argocd
  annotations:
    # The controller and CRDs must be available before application backup CRs.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  destination:
    namespace: volsync-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: volsync
    repoURL: https://backube.github.io/helm-charts
    targetRevision: 0.16.0
    helm:
      releaseName: volsync
      valuesObject:
        manageCRDs: true
        # The main cluster has no Prometheus operator; the OTel collector
        # (daemonset) scrapes pods carrying prometheus.io annotations and
        # remote-writes them to Moonbase. VolSync's metrics endpoint is
        # normally protected by kube-auth-proxy, so auth is disabled to let
        # the collector scrape it directly.
        metrics:
          disableAuth: true
        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8443"
          prometheus.io/path: "/metrics"
          prometheus.io/scheme: "https"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
