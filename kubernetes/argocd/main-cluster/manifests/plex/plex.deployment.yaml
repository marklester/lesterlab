---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
  labels:
    app: plex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      hostNetwork: true
      containers:
      - name: plex
        image: linuxserver/plex:1.43.4
        imagePullPolicy: Always
        env:
        - name: PUID
          value: "65534"
        - name: PGID
          value: "65534"
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: "NVIDIA_DRIVER_CAPABILITIES"
          value: "compute,video,utility"          
        - name: TZ
          value: "America/New_York"
        - name: PLEX_CLAIM
          value: "claim-SCcw5yRj1FZSeFMSnRZu"
        ports:
        - name: http
          containerPort: 32400
          protocol: TCP
        - name: plex-ht-control
          containerPort: 3005
          protocol: TCP
        - name: dlna-tcp
          containerPort: 32469
          protocol: TCP
        - name: dlna-udp
          containerPort: 1900
          protocol: UDP
        - name: avahi
          containerPort: 5353
          protocol: UDP
        - name: gdm1
          containerPort: 32410
          protocol: UDP
        - name: gdm2
          containerPort: 32412
          protocol: UDP
        - name: gdm3
          containerPort: 32413
          protocol: UDP
        - name: gdm4
          containerPort: 32414
          protocol: UDP
        volumeMounts:
        - name: media
          mountPath: /media/
          subPath: media
        - name: plex-config
          mountPath: /config
        - name: logs
          mountPath: "/config/Library/Application Support/Plex Media Server/Logs"
        securityContext:
          privileged: true          
        livenessProbe:
          httpGet:
            path: /identity
            port: 32400
          initialDelaySeconds: 10
          timeoutSeconds: 10
        resources:
          requests:
            memory: "4Gi"
          limits:
            memory: "8Gi"
      - name: plex-file-logs
        image: victoriametrics/vlagent:v1.52.0
        args:
        - --envflag.enable
        - --envflag.prefix=VL_
        - --fileCollector.glob=/logs/**/*.log*
        - '--fileCollector.extraFields={"cluster":"main","app":"plex","log_source":"file","kubernetes.container_name":"plex","kubernetes.pod_name":"%{POD_NAME}","kubernetes.pod_namespace":"plex"}'
        - --fileCollector.streamFields=cluster,app,kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name,file
        - --fileCollector.decolorizeFields=_msg
        - '--remoteWrite.headers=AccountID:0^^ProjectID:0'
        - --remoteWrite.url=http://victorialogs.moonbase.home/insert/native
        - --tmpDataPath=/var/lib/vlagent
        - --loggerFormat=json
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: logs
          mountPath: /logs
          readOnly: true
        - name: plex-file-log-vlagent-data
          mountPath: /var/lib/vlagent
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 256Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: plex-media-cephfs
        - name: plex-config
          persistentVolumeClaim:
            claimName: plex-config 
        - name: logs
          emptyDir: {}
        - name: plex-file-log-vlagent-data
          emptyDir: {}
