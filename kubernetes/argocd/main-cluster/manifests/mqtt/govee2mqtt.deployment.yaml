apiVersion: apps/v1
kind: Deployment
metadata:
  name: govee2mqtt
  namespace: mqtt
  labels:
    app: govee2mqtt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: govee2mqtt
  template:
    metadata:
      labels:
        app: govee2mqtt
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: govee2mqtt
        image: ghcr.io/wez/govee2mqtt:2026.03.25-ab9deb66
        imagePullPolicy: IfNotPresent
        env:
        - name: GOVEE_MQTT_HOST
          value: "mqtt"
        - name: GOVEE_MQTT_PORT
          value: "1883"
        - name: RUST_LOG
          value: "govee=trace"
        - name: GOVEE_EMAIL
          valueFrom:
            secretKeyRef:
              name: govee-credentials
              key: email 
        - name: GOVEE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: govee-credentials
              key: password            
        - name: GOVEE_API_KEY
          valueFrom:
            secretKeyRef:
              name: govee-credentials
              key: api-key
        - name: "TZ"
          value: "US/Eastern"
        - name: "GOVEE_LAN_SCAN"
          value: "192.168.0.40"
