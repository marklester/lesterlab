- name: common node setup
  hosts: main
  serial: 1
  vars_files:
    - secrets.yml
  become: yes  # Run as sudo
  tasks:
    - name: Install Nfs Common
      apt:
        name: nfs-common
        state: present
        update_cache: yes        
    - name: Update Nfs Mount Configuration
      ansible.builtin.copy:
        dest: /etc/nfsmount.conf
        content: |
          [ NFSMount_Global_Options ]
          Defaultvers=4.1
    - name: Configure NFS directory delegation workaround
      tags: [nfs-directory-delegations]
      block:
        # Ganesha bundled with Ceph rejects newer Linux directory delegation
        # requests with EREMOTEIO. Remove once the deployed Ganesha is fixed:
        # https://github.com/nfs-ganesha/nfs-ganesha/issues/1385
        - name: Check supported NFSv4 module parameters
          ansible.builtin.command: modinfo -p nfsv4
          register: nfsv4_parameters
          changed_when: false
          check_mode: false

        - name: Persist disabled directory delegations on supported kernels
          ansible.builtin.copy:
            dest: /etc/modprobe.d/nfs-nodirdelegation.conf
            owner: root
            group: root
            mode: '0644'
            content: |
              # Work around NFS-Ganesha issue #1385 (Remote I/O error).
              options nfsv4 directory_delegations=N
          when: "'directory_delegations:' in nfsv4_parameters.stdout"
          register: nfs_directory_delegations_config

        - name: Include NFS module configuration in initramfs
          ansible.builtin.command: update-initramfs -u -k all
          when: nfs_directory_delegations_config is changed

        - name: Check whether the running kernel exposes directory delegations
          ansible.builtin.stat:
            path: /sys/module/nfsv4/parameters/directory_delegations
          register: nfs_directory_delegations_parameter

        - name: Read current directory delegation setting
          ansible.builtin.slurp:
            src: /sys/module/nfsv4/parameters/directory_delegations
          register: nfs_directory_delegations_current
          when: nfs_directory_delegations_parameter.stat.exists

        - name: Disable directory delegations immediately without remounting
          ansible.builtin.shell: echo N > /sys/module/nfsv4/parameters/directory_delegations
          when:
            - nfs_directory_delegations_parameter.stat.exists
            - (nfs_directory_delegations_current.content | b64decode | trim) != 'N'
    - name: update-sysctl-settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/local.conf
        content: |
          fs.inotify.max_user_watches=2099999999
          fs.inotify.max_user_instances=2099999999
          fs.inotify.max_queued_events=2099999999
    - name: Reload all sysctl configuration using shell command
      ansible.builtin.shell: sysctl -p --system
    - name: Ensure systemd-networkd-wait-online.service drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/systemd-networkd-wait-online.service.d
        state: directory
        mode: '0755'
    - name: Create a drop-in file to cap the wait-online timeout at 30 seconds
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStart=
          ExecStart=/lib/systemd/systemd-networkd-wait-online --any -o routable --timeout=30
        dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/10-timeout-override.conf
        mode: '0644'
      # The 'ExecStart=' line is necessary to clear the default ExecStart command before
      # specifying the new one. '-o routable' waits for any routable interface (works on
      # all nodes regardless of interface name, e.g. bond0 vs eno4) and the 30s timeout
      # avoids the 120s default hang when the network isn't up at boot.
    - name: Reload systemd daemon to apply changes
      ansible.builtin.systemd:
        daemon_reload: true
    - name: (Optional) Restart the service to verify the change immediately
      # This is helpful for testing; on boot the change will be active automatically.
      ansible.builtin.systemd:
        name: systemd-networkd-wait-online.service
        state: restarted
      ignore_errors: true # The service might fail if the network condition isn't met, which is expected during testing      
    - name: ensure rancher config dir exists
      file:
        path: /etc/rancher/rke2
        recurse: true
        state: directory
    - name: generate-rke-config
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        content: |
          token: {{ main_rke2_token }}
          server: 'https://rke2.home:9345'
          tls-san:
            - rke2.home
          ingress-controller: none
          etcd-expose-metrics: true
          kube-controller-manager-arg:
            - 'bind-address=0.0.0.0'
          kube-scheduler-arg:
            - 'bind-address=0.0.0.0' 
          kubelet-arg:
            - 'allowed-unsafe-sysctls=net.ipv4.conf.all.src_valid_mark,net.ipv6.conf.all.disable_ipv6'
    - name: Configure the internal container registry mirror
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/registries.yaml
        owner: root
        group: root
        mode: '0644'
        content: |
          mirrors:
            registry.home:
              endpoint:
                - 'http://registry.home'
    - name: Enable and start a rke2 server
      ansible.builtin.service:
        name: rke2-server
        state: restarted
        enabled: yes
