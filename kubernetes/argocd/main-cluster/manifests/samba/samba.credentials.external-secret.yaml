apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: samba-credentials
  namespace: samba
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: main-secret-store
    kind: ClusterSecretStore
  target:
    name: samba-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: family
        password: "{{ .password }}"
        users.json: |
          {
            "samba-container-config": "v0",
            "users": {
              "all_entries": [
                {
                  "name": "family",
                  "password": "{{ .password }}"
                }
              ]
            }
          }
  data:
    - secretKey: password
      remoteRef:
        key: family-user-password
        version: v1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
