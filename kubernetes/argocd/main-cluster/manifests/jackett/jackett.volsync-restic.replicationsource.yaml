apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: jackett-config-backup
  namespace: jackett
  annotations:
    # The ExternalSecret must first create jackett-restic-config.
    argocd.argoproj.io/sync-wave: "1"
spec:
  sourcePVC: jackett-config
  trigger:
    # Intentionally one-time for the pilot. Replace with a cron schedule only
    # after a backup and isolated restore have succeeded.
    manual: initial-backup
  restic:
    repository: jackett-restic-config
    copyMethod: Snapshot
    volumeSnapshotClassName: csi-cephfsplugin-snapclass
    # Temporary PiT and cache PVCs are disposable; do not inherit the source
    # claim's Retain storage class.
    storageClassName: rook-cephfs
    cacheStorageClassName: rook-cephfs
    cacheCapacity: 1Gi
    moverSecurityContext:
      runAsUser: 65534
      runAsGroup: 65534
    moverResources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
      monthly: 6
