apiVersion: v1
kind: ConfigMap
metadata:
  name: samba-config
  namespace: samba
data:
  config.json: |
    {
      "samba-container-config": "v0",
      "configs": {
        "samba": {
          "shares": [
            "backups",
            "home-share",
            "media"
          ],
          "globals": [
            "samba"
          ],
          "instance_name": "SAMBA"
        }
      },
      "shares": {
        "backups": {
          "options": {
            "path": "/shares/backups",
            "read only": "no",
            "browseable": "yes",
            "guest ok": "no",
            "valid users": "family",
            "force user": "nobody",
            "force group": "nobody"
          }
        },
        "home-share": {
          "options": {
            "path": "/shares/home",
            "read only": "no",
            "browseable": "yes",
            "guest ok": "no",
            "valid users": "family",
            "force user": "nobody",
            "force group": "nobody"
          }
        },
        "media": {
          "options": {
            "path": "/shares/media",
            "read only": "no",
            "browseable": "yes",
            "guest ok": "no",
            "valid users": "family",
            "force user": "nobody",
            "force group": "nobody"
          }
        }
      },
      "globals": {
        "samba": {
          "options": {
            "workgroup": "WORKGROUP",
            "netbios name": "SAMBA",
            "server role": "standalone server",
            "security": "user",
            "map to guest": "Never",
            "server min protocol": "SMB2_10",
            "server max protocol": "SMB3",
            "server signing": "mandatory",
            "smb encrypt": "desired",
            "load printers": "no",
            "printing": "bsd",
            "printcap name": "/dev/null",
            "disable spoolss": "yes"
          }
        }
      }
    }
