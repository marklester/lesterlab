apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry
  namespace: argocd
spec:
  destination:
    namespace: registry
    server: https://kubernetes.default.svc
  project: default
  source:
    path: kubernetes/argocd/main-cluster/manifests/registry
    repoURL: https://github.com/marklester/lesterlab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
