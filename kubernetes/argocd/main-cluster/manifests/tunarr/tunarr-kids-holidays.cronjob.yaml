apiVersion: batch/v1
kind: CronJob
metadata:
  name: tunarr-kids-holidays
  namespace: tunarr
spec:
  schedule: "0 * * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: holidays
              image: registry.home/tunarr:1.3.15-patch
              command: ["node", "/scripts/holidays.mjs"]
              env:
                - name: TUNARR_URL
                  value: http://tunarr.tunarr.svc.cluster.local
                - name: TZ
                  value: America/New_York
                - name: HOLIDAYS_CONFIG
                  value: /scripts/kids.json
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: tunarr-holidays
