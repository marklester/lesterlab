apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pig-ebank
  namespace: pig-ebank
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pig-ebank.lester.network
    - pig-ebank.app
    secretName: pig-ebank-tls
  - hosts:
    - api.pig-ebank.app
    secretName: pig-ebank-api-tls
  rules:
  - host: pig-ebank.home
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: pig-ebank
            port:
              number: 80
  - host: pig-ebank.lester.network
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pig-ebank
            port:
              number: 80
  - host: pig-ebank.app
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: pig-ebank
            port:
              number: 80
  - host: api.pig-ebank.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pig-ebank
            port:
              number: 80
  - host: api.pig-ebank.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pig-ebank
            port:
              number: 80
