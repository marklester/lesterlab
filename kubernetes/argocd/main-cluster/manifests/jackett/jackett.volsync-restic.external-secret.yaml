apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jackett-restic-config
  namespace: jackett
  annotations:
    # Create the Restic configuration before VolSync reconciles its source.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: main-secret-store
    kind: ClusterSecretStore
  target:
    name: jackett-restic-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # A dedicated repository is required for every PVC.
        RESTIC_REPOSITORY: rest:http://restic.moonbase.home/jackett-config
        RESTIC_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: restic/main-backups/password
        version: v1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
