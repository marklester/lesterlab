apiVersion: v1
kind: Service
metadata:
  name: mqtt
  namespace: mqtt
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.0.212
  selector:
    app: mqtt
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
    protocol: TCP
  - name: mqtt2
    port: 9001
    targetPort: 9001
    protocol: TCP
