apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 91.3.0
    helm:
      valuesObject: 
        namespaceOverride: monitoring

        # Recording rules that alias the OTel-remote-written Ceph counters
        # (which carry a `_total` suffix) back to the plain metric names the
        # Ceph dashboard's built-in PromQL expects, so the dashboard
        # IOPS/throughput graphs render. The ceph-exporter sidecars export
        # plain names (e.g. `ceph_pool_wr`); the OTel collector's
        # prometheusremotewrite exporter appends `_total` to counters when
        # remote-writing to this Prometheus, so the dashboard's
        # `sum(rate(ceph_pool_wr[1m]))` queries otherwise return empty.
        # Rendered as a PrometheusRule carrying the `release: kube-prometheus-stack`
        # label, which the Prometheus CR's ruleSelector matches.
        additionalPrometheusRulesMap:
          ceph-dashboard-aliases:
            groups:
              - name: ceph.dashboard-aliases
                rules:
                  # IOPS (dashboard: WRITEIOPS / READIOPS)
                  - record: ceph_pool_wr
                    expr: ceph_pool_wr_total
                  - record: ceph_pool_rd
                    expr: ceph_pool_rd_total
                  # Throughput (dashboard: READTHROUGHPUT / WRITETHROUGHPUT)
                  - record: ceph_pool_rd_bytes
                    expr: ceph_pool_rd_bytes_total
                  - record: ceph_pool_wr_bytes
                    expr: ceph_pool_wr_bytes_total
                  # OSD-level op counters (used by some OSD IOPS views)
                  - record: ceph_osd_op_w
                    expr: ceph_osd_op_w_total
                  - record: ceph_osd_op_r
                    expr: ceph_osd_op_r_total

        alertmanager:
          enabled: false

        grafana:
          enabled: true
          namespaceOverride: monitoring
          ingress:
            enabled: true
            hosts:
              - grafana.moonbase.home
          persistence:
            enabled: true
            type: pvc
            accessModes:
              - ReadWriteOnce
            size: 4Gi
          admin:
            # existingSecret: kube-prometheus-stack-grafana
          grafana.ini:
            smtp:
              enabled: true
              host: "smtp.gmail.com:587"
              from_address: mlester+grafana@gmail.com

          smtp:
            existingSecret: "grafana-smtp-credentials"
            userKey: "username"
            passwordKey: "password"
          initChownData:
            enabled: false
          prometheusOperator:
            certManager:
              enabled: true

        prometheus:
          ingress:
            enabled: true
            hosts:
              - prometheus.moonbase.home             
          prometheusSpec:
            scrapeInterval: 30s
            evaluationInterval: 30s
            maximumStartupDurationSeconds: 600
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            enableRemoteWriteReceiver: true
            enableOTLPReceiver: true
            enableFeatures:
              - remote-write-receiver
            retention: 14d
            retentionSize: 85GB
            storageSpec: 
              ## Using PersistentVolumeClaim
              ##
              volumeClaimTemplate:
                spec:
                  # storageClassName: rook-cephfs
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 100Gi
            securityContext:
              runAsUser: 1000
              runAsGroup: 2000
              runAsNonRoot: true
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault              
            # initContainers:
        prometheus-node-exporter:
          namespaceOverride: monitoring
          # extraArgs: []

        kube-state-metrics:
          namespaceOverride: monitoring
  syncPolicy:
    automated:
      prune: true       # Automatically delete resources no longer in Git
      selfHeal: true    # Correct manual changes made in the cluster (drift detection)
    syncOptions:
      - CreateNamespace=true           # Automatically create the target namespace if it doesn't exist
      - PruneLast=true                 # Defer resource deletion until after new ones are applied (safer rollouts)
      - PrunePropagationPolicy=foreground # Gracefully delete dependent resources (recommended for safety)
      - ServerSideApply=true  