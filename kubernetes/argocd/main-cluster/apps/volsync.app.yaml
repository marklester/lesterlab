apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volsync
  namespace: argocd
spec:
  destination:
    namespace: volsync-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: volsync
    repoURL: https://backube.github.io/helm-charts
    targetRevision: 0.16.0
    helm:
      releaseName: volsync
      valuesObject:
        manageCRDs: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
