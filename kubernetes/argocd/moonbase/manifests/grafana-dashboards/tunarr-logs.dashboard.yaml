apiVersion: v1
kind: ConfigMap
metadata:
  name: tunarr-logs-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  tunarr-logs.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "victorialogs"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1}, "unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single"}},
          "targets": [
            {"datasource": {"type": "victoriametrics-logs-datasource", "uid": "victorialogs"}, "editorMode": "code", "expr": "cluster:main kubernetes.pod_namespace:tunarr kubernetes.container_name:tunarr | stats () rate()", "legendFormat": "Tunarr", "queryType": "statsRange", "refId": "A"}
          ],
          "title": "Tunarr log rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "victorialogs"},
          "gridPos": {"h": 16, "w": 24, "x": 0, "y": 8},
          "id": 2,
          "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyJSON": true, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true},
          "targets": [
            {"datasource": {"type": "victoriametrics-logs-datasource", "uid": "victorialogs"}, "editorMode": "code", "expr": "cluster:main kubernetes.pod_namespace:tunarr kubernetes.container_name:tunarr", "queryType": "logs", "refId": "A"}
          ],
          "title": "Tunarr logs",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": ["logs", "tunarr"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Tunarr Logs",
      "uid": "tunarr-logs",
      "version": 1
    }
