services:
  llama:
    image: ghcr.io/anbeeld/beellama.cpp:server-cuda13-v0.4.7
    pull_policy: always
    container_name: beellama-server-cuda13
    environment:
      LLAMA_ARG_CHAT_TEMPLATE_KWARGS: '{"preserve_thinking":true,"reasoning_effort":"medium"}'
    ports:
      - "1234:8080"
    volumes:
      - type: bind
        source: C:/Users/starf/.lmstudio/models
        target: /models
        read_only: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      -m /models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ3_S.gguf
      --no-mmproj
      --device CUDA0
      --spec-draft-device CUDA0
      --gpu-layers-draft all
      --spec-type draft-mtp
      --spec-draft-n-max ${BEELLAMA_DRAFT_MAX:-3}
      --spec-draft-ubatch-size ${BEELLAMA_DRAFT_UBATCH:-128}
      --n-gpu-layers all
      --threads 6
      --fit off
      --load-mode none
      --no-warmup
      --flash-attn on
      --ctx-size ${BEELLAMA_CONTEXT:-81920}
      --parallel 1

      --cache-type-k kvarn5
      --cache-type-v kvarn4
      --kv-tail-tokens ${BEELLAMA_KV_TAIL:-1024}
      --cache-ram ${BEELLAMA_CACHE_RAM:-4096}
      --batch-size 512
      --ubatch-size ${BEELLAMA_UBATCH:-512}
      --jinja
      --temp 1
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning auto
      --reasoning-preserve
      --host 0.0.0.0
      --port 8080
    restart: unless-stopped
