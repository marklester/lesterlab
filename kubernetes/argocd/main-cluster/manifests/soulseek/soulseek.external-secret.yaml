apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: soulseek-credentials
spec:
  secretStoreRef:
    name: main-secret-store
    kind: ClusterSecretStore
  target:
    name: soulseek-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: soulseek/username
        version: v1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: soulseek/password
        version: v1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: vpn-username
      remoteRef:
        key: vpn/username
        version: v1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: vpn-password
      remoteRef:
        key: vpn/password
        version: v1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
